<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot password - MegaBazaar</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{brand:{blue:'#2874f0',yellow:'#ff9f00',dark:'#172337',light:'#f1f3f6'}}}}}</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Inter',sans-serif} .fld{width:100%;border-bottom:1px solid #d1d5db;padding:.5rem 0;font-size:.875rem;outline:none;background:transparent} .fld:focus{border-color:#2874f0} .btn{background:#ff9f00;color:#172337;font-weight:700;padding:.7rem 1rem;border-radius:.125rem;width:100%;box-shadow:0 1px 2px rgba(0,0,0,.2)} .btn:hover{background:#fbbf24} .btn:disabled{opacity:.6;cursor:wait}</style>
<script src="js/app.js"></script>
</head>
<body class="bg-brand-light text-gray-800 antialiased">
<div id="site-header"></div>
<main class="max-w-4xl mx-auto px-4 py-10">
<div class="bg-white shadow-sm border border-gray-100 flex flex-col md:flex-row min-h-[460px]">
<div class="md:w-2/5 bg-brand-blue text-white p-8 flex flex-col justify-between">
<div><h1 class="text-2xl font-bold">Forgot password?</h1><p class="mt-3 text-blue-100 text-sm leading-relaxed">We will email a 6-digit OTP to your registered email address. The OTP is valid for 10 minutes.</p></div>
<i class="fa-solid fa-bag-shopping text-6xl text-brand-yellow/80 mt-8"></i></div>
<div class="flex-1 p-8">
<div id="msg" class="hidden mb-4"></div>
<form id="s1" class="space-y-5" novalidate>
<label class="block text-xs text-gray-500">Registered email<input id="email" type="email" class="fld" required></label>
<button class="btn">Send OTP</button>
</form>
<form id="s2" class="space-y-5 hidden" novalidate>
<p class="text-sm text-gray-600">Enter the 6-digit OTP sent to <b id="shown"></b>.</p>
<label class="block text-xs text-gray-500">OTP<input id="otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code" class="fld tracking-[0.5em] text-lg" required></label>
<button class="btn">Verify OTP</button>
<p class="text-center text-sm"><button type="button" id="resend" class="text-brand-blue font-semibold hover:underline disabled:text-gray-400 disabled:no-underline">Resend OTP</button></p>
</form>
<form id="s3" class="space-y-5 hidden" novalidate>
<label class="block text-xs text-gray-500">New password (min 8 characters, letters and numbers)<input id="pw" type="password" autocomplete="new-password" class="fld" required></label>
<label class="block text-xs text-gray-500">Confirm new password<input id="pw2" type="password" autocomplete="new-password" class="fld" required></label>
<button class="btn">Update password</button>
</form>
<p class="text-center text-sm mt-6"><a href="login.html" class="text-brand-blue font-semibold hover:underline">Back to login</a></p></div></div></main>
<script>

const msg = document.getElementById('msg');
const steps = ['s1', 's2', 's3'];
const show = n => steps.forEach((id, i) => document.getElementById(id).classList.toggle('hidden', i !== n));
let mail = '', code = '', timer = null;
const post = (path, body) => MB.api(path, { method: 'POST', auth: false, body });

function cooldown() {
  const btn = document.getElementById('resend'); let left = 60; btn.disabled = true;
  clearInterval(timer);
  timer = setInterval(() => {
    left--; btn.textContent = left > 0 ? 'Resend OTP in ' + left + 's' : 'Resend OTP';
    if (left <= 0) { btn.disabled = false; clearInterval(timer); }
  }, 1000);
  btn.textContent = 'Resend OTP in 60s';
}
async function sendOtp() {
  const r = await post('/auth/forgot-password', { email: mail });
  MB.msg(msg, r.message, true); cooldown();
}
document.getElementById('s1').addEventListener('submit', async e => {
  e.preventDefault(); mail = email.value.trim();
  try { await sendOtp(); document.getElementById('shown').textContent = mail; show(1); }
  catch (err) { MB.msg(msg, err.message, false); }
});
document.getElementById('resend').addEventListener('click', async () => {
  try { await sendOtp(); } catch (err) { MB.msg(msg, err.message, false); }
});
document.getElementById('s2').addEventListener('submit', async e => {
  e.preventDefault(); code = otp.value.trim();
  try { await post('/auth/verify-otp', { email: mail, otp: code }); MB.msg(msg, 'OTP verified. Choose a new password.', true); show(2); }
  catch (err) { MB.msg(msg, err.message, false); }
});
document.getElementById('s3').addEventListener('submit', async e => {
  e.preventDefault();
  if (pw.value !== pw2.value) return MB.msg(msg, 'Passwords do not match', false);
  try {
    const r = await post('/auth/reset-password', { email: mail, otp: code, newPassword: pw.value });
    MB.msg(msg, r.message + ' Redirecting to login...', true);
    setTimeout(() => location.href = 'login.html', 1800);
  } catch (err) { MB.msg(msg, err.message, false); }
});
</script>
</body>
</html>
