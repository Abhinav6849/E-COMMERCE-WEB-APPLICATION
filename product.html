<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product - MegaBazaar</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{brand:{blue:'#2874f0',yellow:'#ff9f00',dark:'#172337',light:'#f1f3f6'}}}}}</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Inter',sans-serif} .fld{width:100%;border-bottom:1px solid #d1d5db;padding:.5rem 0;font-size:.875rem;outline:none;background:transparent} .fld:focus{border-color:#2874f0} .btn{background:#ff9f00;color:#172337;font-weight:700;padding:.7rem 1rem;border-radius:.125rem;width:100%;box-shadow:0 1px 2px rgba(0,0,0,.2)} .btn:hover{background:#fbbf24} .btn:disabled{opacity:.6;cursor:wait}</style>
<script src="js/app.js"></script>
</head>
<body class="bg-brand-light text-gray-800 antialiased">
<div id="site-header"></div>

<main class="max-w-5xl mx-auto px-4 py-6">
<a href="products.html" class="text-sm text-brand-blue font-semibold hover:underline"><i class="fa-solid fa-arrow-left mr-1"></i> Continue shopping</a>
<div id="box" class="bg-white rounded-lg shadow-sm border border-gray-100 p-6 mt-3 grid md:grid-cols-2 gap-8"><p class="text-gray-500">Loading...</p></div>
</main>
<script>

const id = new URLSearchParams(location.search).get('id');
(async () => {
  const box = document.getElementById('box');
  try {
    const p = await MB.api('/products/' + encodeURIComponent(id), { auth: false });
    document.title = p.name + ' - MegaBazaar';
    const off = p.mrp > p.price ? Math.round((1 - p.price / p.mrp) * 100) : 0;
    box.innerHTML = '<div class="bg-gray-50 rounded flex items-center justify-center h-72 md:h-96"><img src="' + MB.esc(p.imageUrl) + '" alt="' + MB.esc(p.name) + '" class="object-contain max-h-full" onerror="this.style.visibility=\'hidden\'"></div>' +
      '<div><p class="text-xs text-gray-500">' + MB.esc(p.category) + '</p><h1 class="text-2xl font-bold mt-1">' + MB.esc(p.name) + '</h1>' +
      (p.ratingCount ? '<div class="flex items-center gap-2 mt-2"><span class="bg-green-700 text-white text-xs font-bold px-2 py-0.5 rounded">' + p.rating.toFixed(1) + ' <i class="fa-solid fa-star text-[9px]"></i></span><span class="text-sm text-gray-400">' + p.ratingCount.toLocaleString('en-IN') + ' ratings</span></div>' : '') +
      '<div class="flex items-baseline gap-3 mt-4"><span class="text-3xl font-bold">' + MB.money(p.price) + '</span>' +
      (off ? '<span class="text-gray-400 line-through">' + MB.money(p.mrp) + '</span><span class="text-green-600 font-semibold">' + off + '% off</span>' : '') + '</div>' +
      '<p class="mt-2 text-sm ' + (p.stock > 0 ? (p.stock < 6 ? 'text-orange-600' : 'text-green-700') : 'text-red-600') + '">' +
      (p.stock > 0 ? (p.stock < 6 ? 'Only ' + p.stock + ' left!' : 'In stock') : 'Out of stock') + '</p>' +
      '<p class="mt-4 text-sm text-gray-600 leading-relaxed">' + MB.esc(p.description || '') + '</p>' +
      (p.stock > 0 ? '<div class="flex gap-3 mt-6"><button data-add="' + p.id + '" class="flex-1 bg-brand-yellow hover:bg-amber-400 text-brand-dark font-bold py-3 rounded shadow">Add to Cart</button>' +
      '<button id="buy" class="flex-1 bg-brand-blue hover:bg-blue-700 text-white font-bold py-3 rounded shadow">Buy Now</button></div>' : '') + '</div>';
    MB.productCard(p); // registers the product for the Add to Cart button
    const buy = document.getElementById('buy');
    if (buy) buy.onclick = () => { const c = MB.getCart(); if (!c.find(i => i.name === p.name)) MB.addToCart(p.name, p.price, p.imageUrl); location.href = 'checkout.html'; };
  } catch (err) { box.innerHTML = '<p class="text-red-600">' + MB.esc(err.message) + '</p>'; }
})();
</script>
</body>
</html>
