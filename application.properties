spring.application.name=megabazar
server.port=${PORT:8080}

# ---- Database: H2 file database (zero install). Data is saved in ./data/megabazar.mv.db ----
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/megabazar}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---- Security (local development defaults; the "prod" profile forces real values) ----
app.jwt.secret=${JWT_SECRET:dev-only-secret-please-change-dev-only-secret}
app.jwt.expiry-minutes=120
app.admin.name=Store Admin
app.admin.email=${ADMIN_EMAIL:admin@example.com}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}

# ---- OTP ----
app.otp.expiry-minutes=10
# Prints the OTP in the console when no mail server is configured (local testing only)
app.otp.log-to-console=${OTP_LOG_TO_CONSOLE:true}

# ---- Email (leave MAIL_HOST empty to disable). Gmail example in README.md ----
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:}

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
server.error.include-message=never
server.forward-headers-strategy=framework
