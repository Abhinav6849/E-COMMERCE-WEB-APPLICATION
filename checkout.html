<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout - MegaBazaar</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{brand:{blue:'#2874f0',yellow:'#ff9f00',dark:'#172337',light:'#f1f3f6'}}}}}</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Inter',sans-serif} .fld{width:100%;border-bottom:1px solid #d1d5db;padding:.5rem 0;font-size:.875rem;outline:none;background:transparent} .fld:focus{border-color:#2874f0} .btn{background:#ff9f00;color:#172337;font-weight:700;padding:.7rem 1rem;border-radius:.125rem;width:100%;box-shadow:0 1px 2px rgba(0,0,0,.2)} .btn:hover{background:#fbbf24} .btn:disabled{opacity:.6;cursor:wait}</style>
<script src="js/app.js"></script>
</head>
<body class="bg-brand-light text-gray-800 antialiased">
<div id="site-header"></div>

<main class="max-w-5xl mx-auto px-4 py-6">
<a href="products.html" class="text-sm text-brand-blue font-semibold hover:underline"><i class="fa-solid fa-arrow-left mr-1"></i> Continue shopping</a>
<div id="done" class="hidden bg-white rounded-lg shadow-sm border border-gray-100 p-10 text-center mt-3"></div>
<div id="main" class="grid md:grid-cols-5 gap-6 mt-3">
<section class="md:col-span-3 bg-white rounded-lg shadow-sm border border-gray-100 p-5"><h1 class="text-lg font-bold mb-2">Your cart</h1><div id="items" class="divide-y divide-gray-100"></div></section>
<section class="md:col-span-2 bg-white rounded-lg shadow-sm border border-gray-100 p-5 h-fit">
<h2 class="text-lg font-bold mb-3">Delivery details</h2>
<form id="f" class="space-y-4" novalidate>
<div id="msg" class="hidden"></div>
<label class="block text-xs text-gray-500">Full name<input id="shipName" class="fld" required></label>
<label class="block text-xs text-gray-500">Mobile number<input id="shipPhone" inputmode="numeric" maxlength="10" class="fld" required></label>
<label class="block text-xs text-gray-500">Delivery address<textarea id="addr" rows="3" class="fld" required></textarea></label>
<div class="text-sm bg-brand-light rounded p-3"><i class="fa-solid fa-money-bill-wave text-brand-blue mr-1"></i> Payment: <b>Cash on Delivery</b></div>
<div class="flex justify-between font-bold text-lg pt-2"><span>Total</span><span id="total">₹0</span></div>
<button id="go" class="btn">Place Order</button>
</form></section></div></main>
<script>

if (MB.requireLogin()) init();
async function init() {
  const u = MB.user() || {};
  shipName.value = u.fullName || ''; shipPhone.value = u.phone || '';
  let cart = MB.getCart();
  let live = {};
  try { (await MB.api('/products?size=100', { auth: false })).items.forEach(p => live[p.name] = p); } catch (e) { /* offline */ }
  // use the store's current prices; drop anything no longer sold
  cart = cart.filter(i => !Object.keys(live).length || live[i.name]).map(i => live[i.name] ? { ...i, price: live[i.name].price, image: live[i.name].imageUrl || i.image } : i);
  MB.setCart(cart);
  const msg = document.getElementById('msg');
  function draw() {
    const box = document.getElementById('items');
    if (!cart.length) { box.innerHTML = '<p class="py-10 text-center text-gray-500">Your cart is empty. <a class="text-brand-blue font-semibold" href="products.html">Browse products</a></p>'; }
    else box.innerHTML = cart.map((i, n) => '<div class="py-4 flex gap-4 items-center"><img src="' + MB.esc(i.image) + '" class="w-16 h-16 object-contain bg-gray-50 border rounded p-1" onerror="this.style.visibility=\'hidden\'">' +
      '<div class="flex-1"><p class="text-sm font-medium">' + MB.esc(i.name) + '</p><p class="text-sm font-bold">' + MB.money(i.price * i.quantity) + '</p>' +
      '<div class="flex items-center gap-3 mt-2"><div class="flex items-center border border-gray-300 rounded"><button data-q="' + n + ':-1" class="px-2">-</button><span class="px-3 text-xs font-semibold">' + i.quantity + '</span><button data-q="' + n + ':1" class="px-2">+</button></div>' +
      '<button data-r="' + n + '" class="text-xs text-red-500 font-medium">Remove</button></div></div></div>').join('');
    document.getElementById('total').textContent = MB.money(cart.reduce((s, i) => s + i.price * i.quantity, 0));
    document.getElementById('go').disabled = !cart.length;
    MB.setCart(cart);
  }
  document.getElementById('items').addEventListener('click', e => {
    const q = e.target.closest('[data-q]'), r = e.target.closest('[data-r]');
    if (q) { const [n, d] = q.dataset.q.split(':').map(Number); cart[n].quantity = Math.min(20, cart[n].quantity + d); if (cart[n].quantity <= 0) cart.splice(n, 1); draw(); }
    if (r) { cart.splice(Number(r.dataset.r), 1); draw(); }
  });
  document.getElementById('f').addEventListener('submit', async e => {
    e.preventDefault();
    const go = document.getElementById('go'); go.disabled = true;
    try {
      const o = await MB.api('/orders', { method: 'POST', body: {
        items: cart.map(i => ({ name: i.name, quantity: i.quantity })),
        shippingName: shipName.value, shippingPhone: shipPhone.value, shippingAddress: addr.value } });
      MB.setCart([]);
      document.getElementById('main').classList.add('hidden');
      const d = document.getElementById('done'); d.classList.remove('hidden');
      d.innerHTML = '<i class="fa-solid fa-circle-check text-5xl text-green-600"></i><h2 class="text-2xl font-bold mt-4">Order placed!</h2><p class="text-gray-600 mt-2">Order #' + o.id + ' &middot; Total ' + MB.money(o.totalAmount) + ' &middot; Cash on Delivery</p>' +
        '<a href="dashboard.html#orders" class="inline-block mt-6 bg-brand-blue text-white font-semibold px-6 py-2 rounded">View my orders</a>';
    } catch (err) { MB.msg(msg, err.message, false); go.disabled = !cart.length; }
  });
  draw();
}
</script>
</body>
</html>
